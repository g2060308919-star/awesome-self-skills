interface:
  display_name: "高精度测试用例生成"
  short_description: "生成可追溯的人工功能测试用例；按明确请求另建执行清单"
  default_prompt: "使用 $generate-test-cases 根据 PRD/module description/module-description、需求文档、模块说明、功能变更、规则变更、验收标准、交互说明、接口契约或粘贴需求，生成高准确、可追溯的人工功能测试用例和测试点。普通请求只交付 Case Document；仅在我明确要求执行清单时，才引用该文档另建并确认 Execution Plan。不会自动执行 E2E 测试，也不用于 Playwright、API 自动化、单元测试代码生成或仅代码审查。"
